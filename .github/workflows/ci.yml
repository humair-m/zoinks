name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust lib tests + binary build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install upx (for build.rs to compress bundled ffmpeg)
        run: |
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" -o /tmp/upx.tar.xz
          tar xf /tmp/upx.tar.xz -C /tmp
          sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/

      - name: Run library tests (no bundled feature)
        run: cargo test --no-default-features --lib

      - name: Build standalone binary (with bundled yt-dlp + ffmpeg)
        run: cargo build --release --no-default-features --features bundled --bin zoinks-tui

      - name: Smoke-test the binary
        run: |
          ./target/release/zoinks-tui --version
          ./target/release/zoinks-tui --help | head -5

  python:
    name: Python wheel build + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install upx (for build.rs to compress bundled ffmpeg)
        run: |
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" -o /tmp/upx.tar.xz
          tar xf /tmp/upx.tar.xz -C /tmp
          sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/

      - name: Install Python build deps
        run: pip install maturin textual pytest ruff

      - name: Build wheel (with bundled yt-dlp + ffmpeg)
        run: maturin build --release --out dist

      - name: Install wheel
        run: pip install --no-deps --force-reinstall dist/*.whl

      - name: Smoke-test the Python package
        run: |
          zoinks --version
          zoinks --help | head -5
          python -c "from zoinks import Zoinks; z=Zoinks(); print('Zoinks instance:', z)"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run ruff check
        run: ruff check python/zoinks/
